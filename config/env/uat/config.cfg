[mysql]
host = localhost
user = @secret@
passwd = @secret@
db = redirect

[smtp]
host = email-smtp.us-west-2.amazonaws.com
port = 587
use_tls = true
login = @secret@
password = @secret@

[aws]

endpoint = https://route53.amazonaws.com
access_key_id = @secret@
secret_access_key = @secret@
hosted_zone_id = @secret@

[mail]
subject_prefix = TEST
from = Syncloud <support@syncloud.it>
device_error = support@syncloud.it

[redirect]
domain = syncloud.info
activate_by_email = true
auth_secret_key = @secret@
mock_dns = false

[api]
socket = /var/www/redirect/redirect.api.socket

[www]
socket = /var/www/redirect/redirect.www.socket
rate_limit_per_minute = 3
rate_limit_per_hour = 8

[cleaner]
user = true

[relay]
address = 35.160.228.14

[mail_outbound]
address = 127.0.0.1:2465
ses_region = us-west-2
free_limit_messages = 50
pro_limit_messages = 2000
max_limit_messages = 10000
rspamd_url = http://127.0.0.1:11333
limit_per_minute = 10
limit_per_hour = 100
limit_per_day = 500
max_recipients = 50
bounce_ratio = 0.05
bounce_minimum = 20
reputation_interval_seconds = 300
max_connections_per_peer = 100
max_concurrent_sends = 20

[mail_inbound]
address = 127.0.0.1:10025
muxer = 127.0.0.1:1337
