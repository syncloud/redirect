[mysql]

host = mysql
user = root
passwd = root
db = redirect

[smtp]

host = mail
port = 1025

[aws]

access_key_id = @secret@
secret_access_key = @secret@
hosted_zone_id = @secret@

[mail]

from = support@redirect.com
device_error = support@syncloud.it

[redirect]

domain = syncloud.test
activate_by_email = true
auth_secret_key = 123456790
mock_dns = false

[api]
socket = /var/www/redirect/redirect.api.socket

[www]
socket = /var/www/redirect/redirect.www.socket

[metrics]
api_addr = :9091
www_addr = :9092

[cleaner]
user = false

[relay]
address = 10.0.0.99
free_limit_bytes = 50000
pro_limit_bytes = 50000
poll_interval_seconds = 1

[mail_relay]
address = 127.0.0.1:10465
ses_region = us-west-2
free_limit_messages = 5
pro_limit_messages = 20
max_limit_messages = 50
limit_per_minute = 3
limit_per_hour = 10
limit_per_day = 20
max_recipients = 5
bounce_ratio = 0.05
bounce_minimum = 5
reputation_interval_seconds = 3600
rspamd_url = http://127.0.0.1:11333
max_connections_per_peer = 5
max_concurrent_sends = 2
ses_endpoint = http://127.0.0.1:4579

[mail_inbound]
address = 127.0.0.1:10025
proxy_protocol = true
port_from = 20000
port_to = 20099
